<h1>Fund Transfer</h1>

<form [formGroup]="transferForm">

  <input
    type="text"
    formControlName="accountTo"
    placeholder="Account Number"
  >

  <br><br>

  <input
    type="number"
    formControlName="amount"
    placeholder="Amount"
  >

  <br><br>

  <button type="submit" (click)="showForm()" [disabled]="transferForm.invalid">
    Send Money
  </button>

  <br>
  <p>Can proceed {{transferForm.valid}}</p>

</form>
