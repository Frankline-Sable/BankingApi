<div
  style="padding: 20px;font-family:sans-serif">

  <h2>Fund Transfer</h2>

  <form [formGroup]="transferForm" (ngSubmit)="submitTransfer()">
    <input type="text" placeholder="Account Number" formControlName="accountTo"/>
    <input type="number" placeholder="Amount" formControlName="amount"/>
    <button type="submit" [disabled]="transferForm.invalid">Send Money</button>
  </form>

  <h2>Transaction History</h2>
  <table border="1" style="width:100%;text-align: left;margin-top:20px">
    <thead>
    <tr>
      <th>ID</th>
      <th>Account</th>
      <th>Amount</th>
    </tr>
    </thead>
    <tbody>
      @for (tx of transactions; track tx.id) {
        <tr>
          <td>{{ tx.id }}</td>
          <td>{{ tx.account }}</td>
          <td>{{ tx.amount }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
