<h1>Fund Transfer</h1>

<form [formGroup]="transferForm" (ngSubmit)="submitTransfer()">

  <input
    type="text"
    formControlName="accountTo"
    placeholder="Account Number"
  >

  <br><br>

  <input
    type="number"
    formControlName="amount"
    placeholder="Amount"
  >

  <br><br>

  <button type="submit" [disabled]="transferForm.invalid">
    Send Money
  </button>

<!--  <button (click)="showForm()" [disabled]="transferForm.invalid">-->
<!--    showForm-->
<!--  </button>-->

  <br>
  <p>Can proceed {{transferForm.valid}}</p>

  <button (click)="loadHistory()">LoadHistory</button>

</form>
